name: Open source verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  open-source:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: pip install -e '.[dev,console,compat,llm-compat]'
      - run: python -c "import importlib.util; assert importlib.util.find_spec('trapdefense_enterprise') is None; assert importlib.util.find_spec('asr') is None"
      - run: python scripts/check-docs.py
      - run: pytest -q
      - run: trapdefense-inspector-pool --help && trapdefense-inspector --help && trapdefense-console --help && trapdefense-benchmark --help
  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci --prefix console
      - run: npm run check --prefix console
      - run: npm run build --prefix console
  proxy-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev,console,pilot]'
      - run: docker pull envoyproxy/envoy@sha256:57e14a549d7bd43c8d3f6d03e8cfa653e037d4b38e133acd9b54f38c524401b4
      - run: TD_CONSOLE_E2E=1 pytest tests/test_console.py -q
      - run: TD_RUNTIME_SMOKE=1 pytest tests/runtime/test_inspector_pool_runtime.py tests/runtime/test_console_pool_runtime.py -q
      - run: TD_MCP_PILOT=1 python -m pytest tests/test_mcp_pilot.py tests/runtime/test_mcp_pilot_runtime.py -q
      - run: python -m pytest tests/runtime/test_gateway_client_compat.py tests/compat/test_oauth_provider_profiles.py tests/compat/test_unsupported_capabilities.py -q
      - run: docker pull quay.io/keycloak/keycloak@sha256:29be7252db0a106f1cd2ac17b9a56ff2668073da645638a38b9fc67deeb2d6c4
      - run: TD_KEYCLOAK_E2E=1 python -m pytest tests/runtime/test_keycloak_compat.py -q

  selfhost-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest httpx PyYAML
      - run: TD_SELFHOST_E2E=1 python -m pytest tests/runtime/test_selfhost_runtime.py -q -s

  plane-faults:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest httpx PyYAML
      - run: TD_FAULT_E2E=1 python -m pytest tests/runtime/test_plane_faults_runtime.py -q -s

  agent-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev,console,compat,llm-compat]'
      - run: TD_AGENT_WORKFLOW_E2E=1 python -m pytest tests/runtime/test_agent_workflow_runtime.py -q -s
