[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trapdefense-ai-firewall"
version = "0.45"
description = "TrapDefense AI Firewall: AI action control, data protection and HTTP/MCP inspection"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Jaemyung Kim"}]
dependencies = [
  "fastapi>=0.115,<1", "httpx>=0.27,<1", "pydantic>=2.8,<3",
  "PyYAML>=6,<7", "uvicorn>=0.30,<1", "presidio-analyzer==2.2.364",
  "PyJWT[crypto]>=2.10,<3", "regex==2026.9.3", "xds-protos==1.83.1",
]

[project.optional-dependencies]
console = ["psutil>=6,<8"]
pilot = ["mcp==1.30.0", "psutil>=6,<8"]
compat = ["mcp==1.30.0"]
llm-compat = ["openai==3.14.1", "anthropic==1.6.0", "google-genai==2.24.0"]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1"]

[project.scripts]
trapdefense-console = "asr_proxy.console.app:main"
trapdefense-benchmark = "asr_proxy.console.benchmark:main"
trapdefense-inspector = "asr_proxy.inspection.server:main"
trapdefense-inspector-pool = "asr_proxy.inspection.pool:main"
trapdefense-demo = "asr_proxy.inspection.demo:main"

[project.urls]
Homepage = "https://trapdefense.com"
Repository = "https://github.com/hellocosmos/ai-security-gateway"

[tool.hatch.build.targets.wheel]
packages = ["src/asr_proxy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
